[package]
name = "lanshare-client"
version = "0.3.0"
edition = "2021"
description = "LanShare 跨平台客户端 - 将远程共享挂载为本地盘符/目录"
autotests = false
autobins = false
autolib = false

[lib]
name = "lanshare_client"
path = "src/lib.rs"

[[bin]]
name = "lanshare-client"
path = "src/main.rs"

# 共享依赖（跨平台）
[dependencies]
lsp-protocol = { path = "../lsp-protocol" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
base64 = "0.22"
parking_lot = "0.12"

# Windows 专属
[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.13", features = ["full", "windows-61"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
] }
widestring = "1"
winreg = "0.55"

# Unix 专属（Linux + macOS）
[target.'cfg(unix)'.dependencies]
fuser = "0.15"
libc = "0.2"

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13", features = ["delayload"] }
