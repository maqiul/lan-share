name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ═══════════════ Windows ═══════════════
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: cargo build --release -p lan-share -p lanshare-client

      - name: Run tests
        run: cargo test -p lsp-protocol

      - name: Package artifacts
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -match 'refs/tags/(.+)') { $Matches[1] } else { "nightly" }
          Write-Host "Packaging version: $tag"

          # 服务端
          New-Item -ItemType Directory -Path pkg\lanshare-server -Force | Out-Null
          Copy-Item target\release\lan-share.exe pkg\lanshare-server\lanshare-server.exe
          Compress-Archive -Path pkg\lanshare-server -DestinationPath "lanshare-server-${tag}-win-x64.zip"

          # 客户端
          New-Item -ItemType Directory -Path pkg\lanshare-client -Force | Out-Null
          Copy-Item target\release\lanshare-client.exe pkg\lanshare-client\lanshare-client.exe
          Compress-Archive -Path pkg\lanshare-client -DestinationPath "lanshare-client-${tag}-win-x64.zip"

          Get-ChildItem *.zip | Select-Object Name, Length

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            lanshare-server-*.zip
            lanshare-client-*.zip

      - name: Upload artifacts (non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: lanshare-build-windows
          path: |
            lanshare-server-*.zip
            lanshare-client-*.zip
          retention-days: 7

  # ═══════════════ Linux ═══════════════
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config libdbus-1-dev

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: cargo build --release -p lan-share -p lanshare-client

      - name: Run tests
        run: cargo test -p lsp-protocol

      - name: Package artifacts
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$GITHUB_REF" = "$TAG" ] && TAG="nightly"
          echo "Packaging version: $TAG"

          mkdir -p pkg/lanshare-server pkg/lanshare-client
          cp target/release/lan-share pkg/lanshare-server/lanshare-server
          cp target/release/lanshare-client pkg/lanshare-client/lanshare-client
          tar -czf "lanshare-server-${TAG}-linux-x64.tar.gz" -C pkg lanshare-server
          tar -czf "lanshare-client-${TAG}-linux-x64.tar.gz" -C pkg lanshare-client
          ls -la *.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lanshare-server-*.tar.gz
            lanshare-client-*.tar.gz

      - name: Upload artifacts (non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: lanshare-build-linux
          path: |
            lanshare-server-*.tar.gz
            lanshare-client-*.tar.gz
          retention-days: 7

  # ═══════════════ macOS (Apple Silicon) ═══════════════
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install macFUSE
        run: brew install --cask macfuse

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: cargo build --release -p lan-share -p lanshare-client

      - name: Package artifacts
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$GITHUB_REF" = "$TAG" ] && TAG="nightly"
          echo "Packaging version: $TAG"

          mkdir -p pkg/lanshare-server pkg/lanshare-client
          cp target/release/lan-share pkg/lanshare-server/lanshare-server
          cp target/release/lanshare-client pkg/lanshare-client/lanshare-client
          tar -czf "lanshare-server-${TAG}-macos-arm64.tar.gz" -C pkg lanshare-server
          tar -czf "lanshare-client-${TAG}-macos-arm64.tar.gz" -C pkg lanshare-client
          ls -la *.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lanshare-server-*.tar.gz
            lanshare-client-*.tar.gz

      - name: Upload artifacts (non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: lanshare-build-macos-arm64
          path: |
            lanshare-server-*.tar.gz
            lanshare-client-*.tar.gz
          retention-days: 7

  # ═══════════════ Linux ARM64 ═══════════════
  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation tools
        run: |
          sudo dpkg --add-architecture arm64
          # 限制默认源只服务 amd64，避免从 security.ubuntu.com 拉 arm64 索引 404
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo find /etc/apt/sources.list.d -name '*.sources' -exec sed -i '/^URIs:/a Architectures: amd64' {} \;
          # arm64 包来自 ports.ubuntu.com
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse' | sudo tee /etc/apt/sources.list.d/arm64.list
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse' | sudo tee -a /etc/apt/sources.list.d/arm64.list
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse' | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            pkg-config libfuse3-dev libdbus-1-dev libfuse3-dev:arm64 libdbus-1-dev:arm64

      - name: Configure linker
        run: |
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' > .cargo/config.toml

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-

      - name: Build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
        run: |
          cargo build --release --no-default-features --target aarch64-unknown-linux-gnu -p lan-share -p lanshare-client

      - name: Package artifacts
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$GITHUB_REF" = "$TAG" ] && TAG="nightly"
          echo "Packaging version: $TAG"

          mkdir -p pkg/lanshare-server pkg/lanshare-client
          cp target/aarch64-unknown-linux-gnu/release/lan-share pkg/lanshare-server/lanshare-server
          cp target/aarch64-unknown-linux-gnu/release/lanshare-client pkg/lanshare-client/lanshare-client
          tar -czf "lanshare-server-${TAG}-linux-arm64.tar.gz" -C pkg lanshare-server
          tar -czf "lanshare-client-${TAG}-linux-arm64.tar.gz" -C pkg lanshare-client
          ls -la *.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lanshare-server-*.tar.gz
            lanshare-client-*.tar.gz

      - name: Upload artifacts (non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: lanshare-build-linux-arm64
          path: |
            lanshare-server-*.tar.gz
            lanshare-client-*.tar.gz
          retention-days: 7
